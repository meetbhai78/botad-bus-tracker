name: Build Flutter Apps (APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apks:
    name: Build APKs for Passenger & Driver Apps
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Build Passenger App
      - name: Get Dependencies (Passenger App)
        working-directory: ./passenger-app
        run: flutter pub get

      - name: Build APK (Passenger App)
        working-directory: ./passenger-app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          API="${API_BASE_URL:-https://botad-bus-tracker.onrender.com}"
          flutter build apk --release --dart-define=API_BASE_URL="$API" --dart-define=MAPTILER_KEY="${MAPTILER_KEY:-YOUR_MAPTILER_KEY}"

      # Build Driver App
      - name: Get Dependencies (Driver App)
        working-directory: ./driver-app
        run: flutter pub get

      - name: Build APK (Driver App)
        working-directory: ./driver-app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          API="${API_BASE_URL:-https://botad-bus-tracker.onrender.com}"
          flutter build apk --release --dart-define=API_BASE_URL="$API" --dart-define=MAPTILER_KEY="${MAPTILER_KEY:-YOUR_MAPTILER_KEY}"

      # Upload Generated APKs to Artifacts
      - name: Upload Passenger App APK
        uses: actions/upload-artifact@v4
        with:
          name: passenger-app-release
          path: passenger-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-release
          path: driver-app/build/app/outputs/flutter-apk/app-release.apk

      # Upload Generated APKs to GitHub Releases (Direct OTA Links)
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Copy APKs with clean release names
          cp passenger-app/build/app/outputs/flutter-apk/app-release.apk passenger-app-release.apk
          cp driver-app/build/app/outputs/flutter-apk/app-release.apk driver-app-release.apk
          
          # Delete existing 'latest' release and tag (if it exists) to allow overwrite
          gh release delete latest --yes || true
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          
          # Create new release with assets
          gh release create latest \
            passenger-app-release.apk \
            driver-app-release.apk \
            --title "Latest Release Builds (Auto-Update)" \
            --notes "Dono apps ke latest compiled APK. Push hone par ye automatic compile aur update ho jate hain."
