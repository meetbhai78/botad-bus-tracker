name: Build Flutter Apps (APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apks:
    name: Build APKs for Passenger & Driver Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Build Passenger App
      - name: Get Dependencies (Passenger App)
        working-directory: ./passenger-app
        run: flutter pub get

      - name: Build APK (Passenger App)
        working-directory: ./passenger-app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          API="${API_BASE_URL:-https://botad-bus-tracker.onrender.com}"
          flutter build apk --release --dart-define=API_BASE_URL="$API" --dart-define=MAPTILER_KEY="${MAPTILER_KEY:-YOUR_MAPTILER_KEY}"

      # Build Driver App
      - name: Get Dependencies (Driver App)
        working-directory: ./driver-app
        run: flutter pub get

      - name: Build APK (Driver App)
        working-directory: ./driver-app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          API="${API_BASE_URL:-https://botad-bus-tracker.onrender.com}"
          flutter build apk --release --dart-define=API_BASE_URL="$API" --dart-define=MAPTILER_KEY="${MAPTILER_KEY:-YOUR_MAPTILER_KEY}"

      # Upload Generated APKs to Artifacts
      - name: Upload Passenger App APK
        uses: actions/upload-artifact@v4
        with:
          name: passenger-app-release
          path: passenger-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-release
          path: driver-app/build/app/outputs/flutter-apk/app-release.apk
