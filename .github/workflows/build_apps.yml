name: Build Flutter Apps (APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apks:
    name: Build APKs for Passenger & Driver Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      # Build Passenger App
      - name: Create Platform Folders & Get Dependencies (Passenger App)
        working-directory: ./passenger-app
        run: |
          flutter create .
          flutter pub get

      - name: Build APK (Passenger App)
        working-directory: ./passenger-app
        run: flutter build apk --release

      # Build Driver App
      - name: Create Platform Folders & Get Dependencies (Driver App)
        working-directory: ./driver-app
        run: |
          flutter create .
          flutter pub get

      - name: Build APK (Driver App)
        working-directory: ./driver-app
        run: flutter build apk --release

      # Upload Generated APKs to Artifacts
      - name: Upload Passenger App APK
        uses: actions/upload-artifact@v4
        with:
          name: passenger-app-release
          path: passenger-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-release
          path: driver-app/build/app/outputs/flutter-apk/app-release.apk
